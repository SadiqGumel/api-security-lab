version: '3.8'

services:
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: juiceshop
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/rest/admin/application-version"]
      interval: 15s
      timeout: 5s
      retries: 3
