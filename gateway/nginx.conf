events {}
http {
    server {
        listen 8000;

        location /graphql {
            default_type application/json;
            return 403 '{"error": "Forbidden: Direct GraphQL access blocked by API Gateway policy."}';
        }

        location / {
            proxy_pass http://juiceshop:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
